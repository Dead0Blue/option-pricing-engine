[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "pricer"
version = "1.0.0"
description = "Option pricing engine: Black-Scholes, trees, Monte Carlo, finite differences, hedging and volatility surfaces"
readme = "README.md"
requires-python = ">=3.9"
license = {text = "MIT"}
authors = [{name = "Adam Ammour"}]
dependencies = ["numpy>=1.22", "scipy>=1.8"]

[project.optional-dependencies]
dev = ["pytest>=7", "matplotlib>=3.5"]
data = ["yfinance", "pandas"]

[tool.setuptools]
packages = ["pricer"]

[tool.pytest.ini_options]
testpaths = ["tests"]
